<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f1220" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet" />
    <meta name="description" content="ArcPuzzels - a free merge puzzle game. Swipe, merge, beat your best." />
    <meta property="og:title" content="ArcPuzzels - Free Merge Puzzle" />
    <meta property="og:description" content="Swipe, merge, reach 2048. Play free in your browser - no install needed." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://arcpuzzels.github.io/arcpuzzels/og-image.png" />
    <meta property="og:url" content="https://arcpuzzels.github.io/arcpuzzels/" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArcPuzzels - Free Merge Puzzle" />
    <meta name="twitter:description" content="Swipe, merge, reach 2048. Play free in your browser." />
    <meta name="twitter:image" content="https://arcpuzzels.github.io/arcpuzzels/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ArcPuzzels - Free Puzzle Game</title>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>
  </head>
  <body>
    <div id="landing" class="landing">
      <canvas id="particle-canvas"></canvas>
      <div class="landing-content">
        <div class="landing-icon">
          <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
            <rect x="4" y="4" width="26" height="26" rx="6" fill="#f59e0b" opacity="0.9"/>
            <rect x="34" y="4" width="26" height="26" rx="6" fill="#fbbf24" opacity="0.7"/>
            <rect x="4" y="34" width="26" height="26" rx="6" fill="#fbbf24" opacity="0.7"/>
            <rect x="34" y="34" width="26" height="26" rx="6" fill="#f59e0b" opacity="0.5"/>
            <text x="17" y="22" text-anchor="middle" fill="#1e1b4b" font-family="Inter" font-weight="900" font-size="14">2</text>
            <text x="47" y="22" text-anchor="middle" fill="#1e1b4b" font-family="Inter" font-weight="900" font-size="14">4</text>
            <text x="17" y="52" text-anchor="middle" fill="#1e1b4b" font-family="Inter" font-weight="900" font-size="14">8</text>
            <text x="47" y="52" text-anchor="middle" fill="#1e1b4b" font-family="Inter" font-weight="900" font-size="14">16</text>
          </svg>
        </div>
        <h1 class="landing-title">ArcPuzzels</h1>
        <p class="landing-subtitle">Swipe. Merge. Reach 2048.</p>
        <button id="play-btn" type="button" class="play-btn">Play Now</button>
        <p class="landing-footer">Free to play &bull; No install needed</p>
      </div>
    </div>

    <div id="ad-top" class="ad-slot" aria-hidden="true">
      <ins class="adsbygoogle"
        style="display:inline-block;width:728px;height:90px"
        data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
        data-ad-slot="XXXXXXXXXX"></ins>
    </div>
    <main id="app"></main>
    <div id="ad-bottom" class="ad-slot" aria-hidden="true">
      <ins class="adsbygoogle"
        style="display:inline-block;width:728px;height:90px"
        data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
        data-ad-slot="XXXXXXXXXX"></ins>
    </div>

    <div id="interstitial-overlay" class="interstitial-overlay hidden">
      <div class="interstitial-box">
        <ins class="adsbygoogle interstitial-ad"
          style="display:inline-block;width:320px;height:480px"
          data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
          data-ad-slot="XXXXXXXXXX"></ins>
        <button id="interstitial-close" type="button" class="interstitial-close" disabled>Close in 5s</button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
